services:
  - type: web
    name: clearbuy-backend
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NEON
        value: gemini-4-neon
      - key: GEMINI_MODEL_HYDROGEN
        value: gemini-4-hydrogen
      - key: GEMINI_MODEL_NANO_BANANA
        value: gemini-nano-banana-2.1
      - key: GEMINI_MODEL_DECISION
        value: gemini-decision-1
      - key: SHOP_MCP_URL
        value: https://mcp.shop.com/

  - type: web
    name: clearbuy-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_USE_MOCK_SSE
        value: "false"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://clearbuy-backend-cvvk.onrender.com
